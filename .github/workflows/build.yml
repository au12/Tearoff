name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner (use macos-15-intel when GitHub's Apple Silicon runners are backed up)
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  macos:
    runs-on: ${{ inputs.runner || 'macos-15' }}   # Apple Silicon unless picked by hand; the app is universal either way
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test 2>&1 | tail -n 60; exit ${PIPESTATUS[0]}

      - name: Build Tearoff.app
        run: |
          COMMIT="${GITHUB_SHA::7}" ./build.sh
          for b in MacOS/Tearoff Helpers/tearoff Helpers/tearoff-filter; do
            echo "$b: $(lipo -archs build/Tearoff.app/Contents/$b)"
            lipo build/Tearoff.app/Contents/$b -verify_arch arm64 x86_64
          done

      - name: Python test tools
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -q pillow zxing-cpp          # make_fixtures.py also needs reportlab + pymupdf; CI uses the committed PDFs
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Fixture tests (label finding, orientation, barcodes scan at 203 dpi)
        run: python3 tests/verify.py build/Tearoff.app/Contents/Helpers/tearoff tests/fixtures out/fixtures

      - name: Build installer package
        run: scripts/make_pkg.sh

      - name: Install the package like a user would
        run: |
          sudo installer -pkg dist/Tearoff.pkg -target /
          sleep 3; pkill -x Tearoff || true          # the installer opens the app when it finishes
          test -x /Applications/Tearoff.app/Contents/MacOS/Tearoff
          test -x /Library/Printers/Tearoff/Filters/tearoff-filter
          test -f /Library/Printers/Tearoff/Tearoff.ppd
          test -x "/Library/PDF Services/Print Label with Tearoff"
          stat -f "%Su:%Sg %Lp %N" /Library/Printers/Tearoff/Filters/tearoff-filter /Library/Logs/Tearoff /Users/Shared/Tearoff
          /usr/local/bin/tearoff version
          pkgutil --pkgs | grep au12
          defaults read /Applications/Tearoff.app/Contents/Info.plist CFBundleShortVersionString

      - name: CUPS end-to-end with the installed driver (lp + fake Zebra)
        run: bash tests/cups_e2e.sh /Applications/Tearoff.app out/cups --installed

      - name: Benchmark
        run: |
          /usr/local/bin/tearoff bench --runs 3 | tee out/bench.txt
          mkdir -p out/perf && cp ~/Library/Logs/Tearoff/*.jsonl out/perf/ 2>/dev/null || true

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p out/screenshots
          shoot() {
            name="$1"; shift
            rm -f /tmp/tearoff-window-id
            open -n /Applications/Tearoff.app --args --demo "$@"
            for _ in $(seq 1 30); do [ -s /tmp/tearoff-window-id ] && break; sleep 0.5; done
            sleep 4
            [ -s /tmp/tearoff-window-id ] && screencapture -x -o -l "$(cat /tmp/tearoff-window-id)" "out/screenshots/$name.png"
            pkill -x Tearoff; sleep 2
          }
          shoot labels "$PWD/tests/fixtures/01_image_letter_dashed.pdf" "$PWD/tests/fixtures/04_two_up.pdf"
          shoot printer --pane printer
          shoot driver --pane driver
          shoot automation --pane automation
          shoot setup-welcome --setup welcome
          shoot setup-find --setup find
          shoot setup-add --setup add
          shoot setup-test --setup test
          shoot setup-ready --setup ready --pluck-time 5.6
          # the Setup Assistant's animation, frame by frame → GIF for the README
          /Applications/Tearoff.app/Contents/MacOS/Tearoff --render-pluck "$PWD/out/pluck" || true
          ls out/pluck | wc -l
          python3 scripts/make_gif.py out/pluck out/screenshots/how-it-works.gif || true
          open dist/Tearoff.pkg
          sleep 8
          id=$(swift scripts/window_id.swift Installer) && screencapture -x -o -l "$id" out/screenshots/installer.png
          pkill -x Installer || true
          ls -la out/screenshots

      - name: Package
        run: |
          mkdir -p dist/Tearoff
          ditto build/Tearoff.app dist/Tearoff/Tearoff.app
          cp install.sh uninstall.sh dist/Tearoff/
          (cd dist && ditto -c -k --keepParent Tearoff Tearoff.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Tearoff
          path: |
            dist/Tearoff.pkg
            dist/Tearoff.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: out/

      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/Tearoff.pkg dist/Tearoff.zip --title "Tearoff $VERSION" \
            --notes "Build $BUILD from ${GITHUB_SHA::7}. Download **Tearoff.pkg** and open it, or: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.sh | bash\`" \
            --target "$GITHUB_SHA"
